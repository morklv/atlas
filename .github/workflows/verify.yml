name: Verify ATLAS

on:
  push:
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: make test
      - run: make field
      - run: python -m py_compile ros2_ws/src/sentinel_ros/sentinel_ros/terrain_fusion_node.py
