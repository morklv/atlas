[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-inspection"
version = "0.1.0"
description = "Reproducible single-drone active inspection in a lightweight depth-sensor simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
field = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "python-multipart>=0.0.9,<1",
]
vision = [
    "atlas-inspection[field]",
    "torch>=2.2",
    "transformers>=4.45,<5",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
]
pointcloud = ["open3d>=0.18,<0.20"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["assets/*.html", "assets/*.js"]
